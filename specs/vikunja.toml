# Type name overrides - comprehensive prefix transformation strategy
# Handle collisions first (most specific patterns first)

# COLLISION: Task conflicts with System.Threading.Tasks.Task from BCL
[[type_name_overrides]]
pattern = "^models\\.Task$"
new_name = "TaskItem"
reason = "Avoid collision with System.Threading.Tasks.Task"

# COLLISION: File conflicts with System.IO.File from BCL
[[type_name_overrides]]
pattern = "^files\\.File$"
new_name = "FileAttachment"
reason = "Avoid collision with System.IO.File, more descriptive name for file attachments"

# COLLISION: Migration appears 3 times - keep provider prefix
[[type_name_overrides]]
pattern = "^microsofttodo\\.Migration$"
new_name = "MicrosoftTodoMigration"
reason = "Keep provider name to avoid collision with other Migration types"

[[type_name_overrides]]
pattern = "^todoist\\.Migration$"
new_name = "TodoistMigration"
reason = "Keep provider name to avoid collision with other Migration types"

[[type_name_overrides]]
pattern = "^trello\\.Migration$"
new_name = "TrelloMigration"
reason = "Keep provider name to avoid collision with other Migration types"

# COLLISION: Token appears 2 times - keep module prefix
[[type_name_overrides]]
pattern = "^auth\\.Token$"
new_name = "AuthToken"
reason = "Keep module name to avoid collision with user.Token"

[[type_name_overrides]]
pattern = "^user\\.Token$"
new_name = "UserToken"
reason = "Keep module name to avoid collision with auth.Token"

# Remove prefixes for all other schemas (generic patterns last)
# These are safe because no collisions exist

[[type_name_overrides]]
pattern = "^models\\.(.+)$"
new_name = "$1"
reason = "Remove models. prefix (44 schemas)"

[[type_name_overrides]]
pattern = "^user\\.(.+)$"
new_name = "$1"
reason = "Remove user. prefix for non-collision schemas"

[[type_name_overrides]]
pattern = "^v1\\.(.+)$"
new_name = "$1"
reason = "Remove v1. version prefix"

[[type_name_overrides]]
pattern = "^auth\\.(.+)$"
new_name = "$1"
reason = "Remove auth. prefix for non-collision schemas"

[[type_name_overrides]]
pattern = "^background\\.(.+)$"
new_name = "$1"
reason = "Remove background. prefix"

[[type_name_overrides]]
pattern = "^files\\.(.+)$"
new_name = "$1"
reason = "Remove files. prefix"

[[type_name_overrides]]
pattern = "^handler\\.(.+)$"
new_name = "$1"
reason = "Remove handler. prefix"

[[type_name_overrides]]
pattern = "^migration\\.(.+)$"
new_name = "$1"
reason = "Remove migration. prefix for non-collision schemas"

[[type_name_overrides]]
pattern = "^notifications\\.(.+)$"
new_name = "$1"
reason = "Remove notifications. prefix"

[[type_name_overrides]]
pattern = "^openid\\.(.+)$"
new_name = "$1"
reason = "Remove openid. prefix"

[[type_name_overrides]]
pattern = "^web\\.(.+)$"
new_name = "$1"
reason = "Remove web. prefix"

[[type_name_overrides]]
pattern = "^code_vikunja_io_api_pkg_modules_auth_openid\\.(.+)$"
new_name = "OpenId$1"
reason = "Simplify long package path to OpenId prefix"

